function parsePrice(q) {
  const s = q.replace(/\s+/g, '').toLowerCase();
  let m;
  if ((m = s.match(/(\d+(?:\.\d+)?)만원대/))) { const v = +m[1] * 10000; return { min: v * 0.8, max: v * 1.3, label: m[1] + '만 원대' }; }
  if ((m = s.match(/(\d+(?:\.\d+)?)만원(이하|미만|안쪽|대)?/))) {
    const v = +m[1] * 10000;
    if (m[2] === '이하' || m[2] === '미만' || m[2] === '안쪽') return { max: v, label: m[1] + '만 원 이하' };
    if (m[2] === '대') return { min: v * 0.8, max: v * 1.3, label: m[1] + '만 원대' };
    return { min: v * 0.75, max: v * 1.3, label: m[1] + '만 원' };
  }
  if (/이하|미만|under|below|less/.test(s) && (m = s.match(/(\d+(?:\.\d+)?)만/))) { const v = +m[1] * 10000; return { max: v, label: m[1] + '만 원 이하' }; }
  if ((m = s.match(/\$(\d{1,3}(?:,\d{3})*|\d+)/))) { const v = +m[1].replace(/,/g, '') * USD_RATE; return { min: v * 0.8, max: v * 1.25, label: '$' + m[1] }; }
  if ((m = s.match(/(\d{1,3}(?:,\d{3})+|\d{4,})원/))) { const v = +m[1].replace(/,/g, ''); return { min: v * 0.8, max: v * 1.25, label: m[1].replace(/,/g, '') + '원' }; }
  if ((m = s.match(/(\d{1,3}(?:,\d{3})+)\s*(?:krw|won)/))) { const v = +m[1].replace(/,/g, ''); return { min: v * 0.8, max: v * 1.25, label: m[1] }; }
  if ((m = s.match(/\b(\d{2,4})k\b/))) { const v = +m[1] * 1000; return { min: v * 0.8, max: v * 1.25, label: m[1] + 'k' }; }
  return null;
}

function analyze(q) {
  const tags = new Set();
  CRITERIA.forEach(c => { if (c.re.test(q)) c.tags.forEach(t => tags.add(t)); });
  let cat = null;
  if (/(원화|오리지널|original|유화|아크릴|캔버스|oilpainting|canvas|acrylic)/i.test(q)) cat = 'original';
  else if (/(일러스트|디지털|illustration|digital|그래픽|graphic)/i.test(q)) cat = 'illustration';
  else if (/(굿즈|goods|소품|상품|머그|엽서|포스터|플레이트|찻잔)/i.test(q)) cat = 'goods';
  return { tags, cat, price: parsePrice(q), space: [...tags].find(t => SPACE_LABEL[t]) || null, raw: q };
}

function scoreWork(w, a) {
  let s = 0;
  a.tags.forEach(t => { if (w.tags.includes(t)) s = w.tags.includes(t) ? s + 2 : s; });
  if (a.space && (w.spaces || []).includes(a.space)) s += 3;
  if (a.cat && w.cat === a.cat) s += 2;
  if (a.tags.has('large') && w.size === 'L') s += 2;
  if (a.tags.has('small') && w.size === 'S') s += 2;
  return s;
}

function recommend(q, lang) {
  const a = analyze(q);
  const inPrice = w => !a.price || ((w.price >= (a.price.min || 0)) && (w.price <= (a.price.max || 1e12)));
  let relax = null;
  let pool = WORKS.filter(w => inPrice(w) && (!a.cat || w.cat === a.cat) && (a.tags.size === 0 || scoreWork(w, a) > 0));
  if (pool.length === 0 && a.price) { relax = 'price'; pool = WORKS.filter(w => (!a.cat || w.cat === a.cat) && scoreWork(w, a) > 0); }
  if (pool.length === 0 && a.cat) { relax = relax || 'cat'; pool = WORKS.filter(w => (a.tags.size === 0 || scoreWork(w, a) > 0)); }
  if (pool.length === 0) { pool = WORKS.slice(0, 3); relax = 'all'; }
  const ranked = pool.map(w => ({ w, s: scoreWork(w, a) })).sort((x, y) => (y.s - x.s) || (a.price ? Math.abs(x.w.price - (a.price.min || 0)) - Math.abs(y.w.price - (a.price.min || 0)) : x.w.price - y.w.price)).map(x => x.w);
  return { items: ranked.slice(0, 3), relax, a };
}

function criteriaLabel(a, lang) {
  const parts = [];
  if (a.space) parts.push(SPACE_LABEL[a.space][lang]);
  if (a.tags.has('warm')) parts.push(lang === 'kr' ? '따뜻한 색' : 'warm colour');
  if (a.tags.has('light')) parts.push(lang === 'kr' ? '화이트·밝은 톤' : 'light tone');
  if (a.tags.has('dark')) parts.push(lang === 'kr' ? '어두운 톤' : 'dark tone');
  if (a.tags.has('sea')) parts.push(lang === 'kr' ? '바다 모티브' : 'sea motif');
  if (a.tags.has('night')) parts.push(lang === 'kr' ? '밤·야경' : 'night');
  if (a.tags.has('sunset')) parts.push(lang === 'kr' ? '노을' : 'sunset');
  if (a.tags.has('gift')) parts.push(lang === 'kr' ? '선물' : 'gift');
  if (a.cat) parts.push(catLabel(a.cat, lang));
  if (a.price) parts.push(a.price.label);
  return [...new Set(parts)];
}

    { kr: '카페 공간에 어울리는 감성 일러스트', en: 'Moody illustrations for a cafe space' },
    { kr: '침실에 어울리는 밤 풍경 소장하고 싶어', en: 'A night scene for the bedroom' }
  ];
  const [thread, setThread] = useState([
    { role: 'bot', text: { kr: '안녕하세요. 러브블러썸 갤러리의 AI 큐레이터입니다. 공간과 예산, 원하는 분위기를 말씀해 주시면 부산 작가 15점 중에서 골라 드립니다.', en: 'Hello — I’m the AI curator at LOVE BLOSSUM GALLERY. Tell me your space, budget or mood, and I’ll choose from 15 works by Busan artists.' } }
  ]);
  const [input, setInput] = useState('');
  const [typing, setTyping] = useState(false);
  const scrollRef = useRef(null);

  const send = useCallback((raw) => {
    const text = (raw || '').trim();
    if (!text) return;
    setThread(t => [...t, { role: 'user', text: { kr: text, en: text } }]);
    setInput('');
    setTyping(true);
    setTimeout(() => {
      const r = recommend(text, 'kr');
      setThread(t => [...t, { role: 'bot', result: r, query: text }]);
      setTyping(false);
    }, 620);
  }, []);

  useEffect(() => {
    const box = scrollRef.current;
    if (!box) return;
    const last = thread[thread.length - 1];
    if (last && last.result) {
      const els = box.querySelectorAll('[data-testid="curator-result"]');
      const el = els[els.length - 1];
      if (el) { box.scrollTop = el.offsetTop - box.offsetTop - 6; return; }
    }
    box.scrollTop = box.scrollHeight;
  }, [thread, typing]);

  const intro = (r) => {
    const labels = criteriaLabel(r.a, lang);
    const cond = labels.length ? labels.join(' · ') : (lang === 'kr' ? '부산 셀렉션' : 'the Busan selection');
    let head;
    if (lang === 'kr') {
      head = `${cond} 기준으로 ${r.items.length}점을 골랐습니다.`;
      if (r.relax === 'price') head += ' 말씀하신 가격대에 정확히 맞는 작품이 없어, 같은 조건에서 가격이 가까운 순으로 대신 골랐습니다.';
      else if (r.relax === 'cat') head += ' 해당 분류에 맞는 작품이 없어 인접한 분류에서 골랐습니다.';
      else if (r.relax === 'all') head = '조건에 맞는 작품을 찾지 못해, 가장 사랑받는 작품부터 보여 드립니다.';
    } else {
      head = `Chosen ${r.items.length} works for: ${cond}.`;
      if (r.relax === 'price') head += ' Nothing sits exactly at that price, so I picked the closest works with the same qualities.';
      else if (r.relax === 'cat') head += ' That category had no match, so I looked at the nearest one.';
      else if (r.relax === 'all') head = 'I couldn’t match those conditions, so here are the most loved works first.';
    }
    return head;
  };

  return (
    <section id="curator" className="py-16 lg:py-24 bg-paper2/60 border-b border-line">
      <div className="max-w-[1440px] mx-auto px-5 lg:px-10 grid lg:grid-cols-[0.85fr_1.15fr] gap-10 lg:gap-16 items-start">
        <div className="lg:sticky lg:top-28">
          <Eyebrow>02 — AI Art Curator</Eyebrow>
          <h2 className="serif text-[34px] lg:text-[46px] leading-[1.15] mt-4">
            {K('말로 고르는,', 'Choose by talking,')}<br /><span className="italic">{K('나의 첫 번째 작품', 'your very first work')}</span>
          </h2>
          <p className="mt-5 text-[13px] leading-[1.95] text-muted max-w-[42ch]">
            {K('“거실이 화이트 톤인데 따뜻한 그림이 필요해요.” 이렇게 말하면 됩니다. 공간·색감·예산·부산 모티브를 함께 읽어 추천 이유까지 설명합니다.',
              '“My living room is white — I need something warm.” That’s enough. I read space, colour, budget and Busan motifs together, and explain why each work fits.')}
          </p>
          <div className="mt-8 space-y-3 text-[11px] text-muted">
            {[
              { kr: '공간 · 거실 / 침실 / 카페 / 오피스', en: 'Space · living / bedroom / cafe / office' },
              { kr: '예산 · 10만 원 이하, 50만 원대, 100만 원 이상', en: 'Budget · under ₩100K, around ₩500K, over ₩1M' },
              { kr: '무드 · 화이트 톤, 어두운 톤, 노을, 야경', en: 'Mood · white tone, dark, sunset, night' }
            ].map((r, i) => (
              <div key={i} className="flex items-start gap-3 border-t border-line pt-3"><span className="text-[10px] w-4">0{i + 1}</span><span>{r[lang]}</span></div>
            ))}
          </div>
        </div>

        <div className="bg-paper border border-line shadow-[0_24px_70px_rgba(0,0,0,.06)]">
          <div className="flex items-center justify-between px-5 py-4 border-b border-line">
            <div className="flex items-center gap-2.5">
              <span className="w-1.5 h-1.5 rounded-full bg-[#5C8A6A]" />
              <span className="serif text-[13px] tracking-[0.18em]">ART CURATOR</span>
              <span className="text-[10px] text-muted uppercase track-sm hidden sm:inline">{K('부산 · 실시간 상담', 'Busan · live')}</span>
            </div>
            <span className="text-[10px] text-muted">15 {K('점의 작품', 'works')}</span>
          </div>

          <div ref={scrollRef} className="no-sb px-4 sm:px-5 py-5 space-y-5 max-h-[440px] sm:max-h-[600px] overflow-y-auto" data-testid="curator-thread">
            {thread.map((m, i) => (
              m.role === 'user' ? (
                <div key={i} className="flex justify-end">
                  <div className="max-w-[85%] bg-ink text-paper px-4 py-3 text-[12.5px] leading-[1.6] rounded-tl-2xl rounded-bl-2xl rounded-br-sm fade-in">{m.text[lang]}</div>
                </div>
              ) : m.result ? (
                <div key={i} className="fade-in" data-testid="curator-result">
                  <div className="flex items-start gap-2.5">
                    <span className="w-6 h-6 shrink-0 rounded-full border border-line flex items-center justify-center text-[9px] serif">AI</span>
                    <div className="min-w-0">
                      <p className="text-[12.5px] leading-[1.85]">{intro(m.result)}</p>
                      <div className="mt-3 space-y-2.5">
                        {m.result.items.map(w => (
                          <CuratorCard key={w.id} id={w.id} reason={w.note[lang]} compact />
                        ))}
                      </div>
                      <p className="text-[11px] text-muted mt-3">
                        {K('더 좁히려면 “30만 원 이하”, “침실”, “선물”처럼 말씀해 주세요.', 'To narrow it, say “under ₩300,000”, “bedroom” or “a gift”.')}
                      </p>
                    </div>
                  </div>
                </div>
              ) : (
                <div key={i} className="flex items-start gap-2.5 fade-in">
                  <span className="w-6 h-6 shrink-0 rounded-full border border-line flex items-center justify-center text-[9px] serif">AI</span>
                  <div className="max-w-[88%] bg-paper2 px-4 py-3 text-[12.5px] leading-[1.8] rounded-tr-2xl rounded-br-2xl rounded-bl-sm border border-line">{m.text[lang]}</div>
                </div>
              )
            ))}
            {typing && (
              <div className="flex items-center gap-2 text-muted fade-in">
                <span className="w-6 h-6 rounded-full border border-line flex items-center justify-center text-[9px] serif">AI</span>

                <span className="text-[11px]">{K('작품을 고르는 중', 'choosing works')}</span>
              </div>
            )}
          </div>

          <div className="px-4 sm:px-5 pb-3 pt-1 border-t border-line">

              {TAGS.map((t, i) => (

/* ============================== CHECKOUT ============================== */
function Checkout() {
  const { checkout, setCheckout, cart, lang, K, subtotal, setCart, order, setOrder, setCartOpen } = useApp();
  const [method, setMethod] = useState('domestic');
  const [form, setForm] = useState({ name: '', email: '', phone: '', addr: '', detail: '', country: 'United States' });
  const [err, setErr] = useState({});
  if (!checkout) return null;
  const shipping = method === 'domestic' ? 0 : 110000;
  const total = subtotal + shipping;

  const submit = (e) => {
    e.preventDefault();
    const er = {};
    if (!form.name.trim()) er.name = true;
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(form.email)) er.email = true;
    if (!form.addr.trim()) er.addr = true;
    if (method === 'global' && !form.country.trim()) er.country = true;
    setErr(er);
    if (Object.keys(er).length) return;
    const no = 'BAC-' + '261127-' + String(Math.floor(1000 + Math.random() * 8999));
    setOrder({ no, method, total, shipping, items: cart.map(i => ({ ...i, w: WORKS.find(x => x.id === i.id) })), name: form.name, email: form.email });
    setCart([]);
    setCartOpen(false);
  };

  const Field = ({ id, label, value, onChange, placeholder, wide, testid }) => (
    <label className={'block ' + (wide ? 'sm:col-span-2' : '')}>
      <span className="text-[10px] uppercase track-sm text-muted">{label}</span>
      <input data-testid={testid} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder}
        className={'mt-1.5 w-full bg-transparent border-b py-2 text-[13px] outline-none transition ' + (err[id] ? 'border-red-400' : 'border-line focus:border-ink')} />
    </label>
  );

  return (
    <div className="fixed inset-0 z-[75] bg-ink/45 backdrop-blur-sm flex items-start sm:items-center justify-center p-0 sm:p-6 overflow-y-auto fade-in" data-testid="checkout-modal">
      <div className="w-full sm:max-w-[960px] bg-paper my-0 sm:my-6 shadow-2xl">
        <div className="flex items-center justify-between px-6 sm:px-8 h-16 border-b border-line">
          <span className="serif text-[13px] tracking-[0.2em]">{order ? K('주문 접수 완료', 'ORDER RECEIVED') : K('결제 · 구매 문의', 'CHECKOUT')}</span>
          <button onClick={() => { setCheckout(false); if (order) setOrder(null); }} data-testid="checkout-close" className="text-[11px] uppercase track-sm hover:text-muted">✕</button>
        </div>

        {order ? (
          <div className="px-6 SM:px-8 sm:px-8 py-12 text-center" data-testid="order-complete">
            <div className="w-14 h-14 mx-auto rounded-full border border-ink flex items-center justify-center">
              <span className="text-xl">✓</span>
            </div>
            <h3 className="serif text-[24px] sm:text-[30px] mt-6">{K('소장 신청이 접수되었습니다', 'Your request is in')}</h3>
            <p className="text-[12.5px] text-muted mt-3 max-w-[46ch] mx-auto leading-relaxed">
              {order.method === 'domestic'
                ? K(`${order.name}님, 담당 큐레이터가 24시간 안에 연락드립니다. 작품 상태 확인 후 안전 포장으로 부산에서 발송합니다.`, `${order.name}, a curator will contact you within 24 hours. After a condition check we ship from Busan, safely packed.`)
                : K(`${order.name}님, 해외 배송(DHL/EMS) 견적과 관세 안내를 24시간 안에 메일로 보내 드립니다.`, `${order.name}, we will email you the DHL/EMS quote and duty notes within 24 hours.`)}
            </p>
            <div className="mt-8 inline-block border border-line px-6 py-5 text-left">
              <div className="flex items-baseline justify-between gap-10">
                <span className="text-[10px] uppercase track-sm text-muted">{K('주문번호', 'Order no.')}</span>
                <span className="tabular-nums text-[13px]" data-testid="order-no">{order.no}</span>
              </div>
              <div className="flex items-baseline justify-between gap-10 mt-2">
                <span className="text-[10px] uppercase track-sm text-muted">{K('배송', 'Shipping')}</span>
                <span className="text-[12px]" data-testid="order-shipping">{order.method === 'domestic' ? K('국내 배송 · 무료 (3–5일)', 'Domestic · free (3–5 days)') : K('DHL/EMS · 글로벌 (5–8일)', 'DHL/EMS · global (5–8 days)')}</span>
              </div>
              <div className="flex items-baseline justify-between gap-10 mt-2">
                <span className="text-[10px] uppercase track-sm text-muted">{K('합계', 'Total')}</span>

            </div>

        ) : (
          <form onSubmit={submit} className="grid lg:grid-cols-[1.15fr_1fr]">

              <div className="mt-3 space-y-2">
                {[
                  { id: 'domestic', title: K('국내 배송 (Domestic KR)', 'Domestic (KR)'), sub: K('부산에서 안전 포장 · 무료 · 3–5일', 'Packed in Busan · free · 3–5 days'), price: K('무료', 'Free') },
                  { id: 'global', title: K('글로벌 컬렉터 (DHL / EMS)', 'Global collector (DHL / EMS)'), sub: K('해외 배송 · 관세 별도 · 5–8일', 'Worldwide · duties extra · 5–8 days'), price: lang === 'kr' ? krw(110000) + ' (≈ ' + usd(110000) + ')' : usd(110000) + ' (₩110,000)' }
                ].map(m => (
                  <button type="button" key={m.id} onClick={() => setMethod(m.id)} data-testid={'ship-' + m.id}
                    className={'w-full text-left border px-4 py-3.5 transition ' + (method === m.id ? 'border-ink bg-paper2/60' : 'border-line hover:border-ink/40')}>

                      <span className="flex items-center gap-2.5">

                        <span className="text-[12.5px]">{m.title}</span>

              <div className="mt-7 grid sm:grid-cols-2 gap-x-6 gap-y-4">
                <Field id="name" testid="co-name" label={K('이름', 'Name')} value={form.name} onChange={v => setForm({ ...form, name: v })} placeholder={K('수령인 이름', 'Full name')} />

                <Field id="phone" testid="co-phone" label={K('연락처 (선택)', 'Phone (optional)')} value={form.phone} onChange={v => setForm({ ...form, phone: v })} placeholder="010-0000-0000" />
                {method === 'global' && <Field id="country" testid="co-country" label={K('국가', 'Country')} value={form.country} onChange={v => setForm({ ...form, country: v })} placeholder="United States" />}
                <div className="sm:col-span-2">
                  <Field id="addr" testid="co-addr" label={K('주소', 'Address')} value={form.addr} onChange={v => setForm({ ...form, addr: v })} placeholder={K('도로명 주소 또는 해외 주소', 'Street address')} />
                </div>
                <div className="sm:col-span-2">
                  <Field id="detail" testid="co-memo" label={K('요청 사항 (선택)', 'Notes (optional)')} value={form.detail} onChange={v => setForm({ ...form, detail: v })} placeholder={K('프레임 요청, 희망 배송일 등', 'Frame request, preferred date')} />

            <div className="px-6 sm:px-8 py-7 bg-paper2/40">
              <p className="text-[10px] uppercase track-sm text-muted">{K('주문 요약', 'Order summary')}</p>
              <div className="mt-3 space-y-3 max-h-[240px] overflow-y-auto no-sb">

}

/* ============================== ROOT ============================== */
function App() {
  const [lang, setLang] = useState('kr');
  const [cart, setCart] = useState([]);
  const [cartOpen, setCartOpen] = useState(false);
  const [detail, setDetail] = useState(null);
  const [docent, setDocent] = useState(false);
  const [room, setRoom] = useState(null);
  const [checkout, setCheckout] = useState(false);
  const [order, setOrder] = useState(null);
  const [mag, setMag] = useState(null);
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);

  const K = useCallback((kr, en) => (lang === 'kr' ? kr : en), [lang]);

  const notify = (msg) => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2400);
  };

  const addToCart = useCallback((id) => {
    setCart(prev => {
      const f = prev.find(i => i.id === id);
      return f ? prev.map(i => i.id === id ? { ...i, qty: i.qty + 1 } : i) : [...prev, { id, qty: 1 }];
    });
    setCartOpen(true);
    notify(lang === 'kr' ? '장바구니에 담았습니다' : 'Added to your bag');
  }, [lang]);

  const removeFromCart = id => setCart(prev => prev.filter(i => i.id !== id));
  const setQty = (id, q) => setCart(prev => q <= 0 ? prev.filter(i => i.id !== id) : prev.map(i => i.id === id ? { ...i, qty: q } : i));
  const subtotal = cart.reduce((s, i) => s + (WORKS.find(w => w.id === i.id)?.price || 0) * i.qty, 0);
  const cartCount = cart.reduce((s, i) => s + i.qty, 0);

  const openWork = id => { setDetail(id); setDocent(false); };
  const openRoom = id => { setRoom(id); };
  const openDocent = id => { setDetail(id); setDocent(true); };
  const closeDocent = () => setDocent(false);
  const openMag = useCallback(id => { setMag(id); }, []);
  const closeMag = useCallback(() => { setMag(null); }, []);

  useEffect(() => {
    const anyOpen = !!detail || !!room || checkout || !!mag;
    document.body.style.overflow = anyOpen ? 'hidden' : '';
    return () => { document.body.style.overflow = ''; };
  }, [detail, room, checkout, mag]);

  useEffect(() => { document.documentElement.lang = lang; }, [lang]);

  const ctx = { lang, setLang, K, cart, setCart, cartCount, subtotal, addToCart, removeFromCart, setQty, cartOpen, setCartOpen, detail, setDetail, openWork, docent, openDocent, closeDocent, room, setRoom, openRoom, checkout, setCheckout, order, setOrder, mag, openMag, closeMag };

  return (
    <Ctx.Provider value={ctx}>
      <Header />
      <main>
        <Hero />
        <Curator />
        <Gallery />
        <Artists />
        <DocentPromo />
        <Magazine />
      </main>
      <Footer />
      <CartDrawer />
      <DetailModal />
      <MagazineReader />
      {room && <RoomPreview />}
      <Checkout />
      {toast && (
        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-[90] bg-ink text-paper px-5 py-3 text-[11.5px] tracking-wide shadow-xl fade-in" data-testid="toast">{toast}</div>
      )}
    </Ctx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
