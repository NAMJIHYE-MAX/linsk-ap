<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LALA LIFE OS</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8f4;color:#302c32;font:15px system-ui}header{background:#f52b83;color:white;padding:32px 6%}h1{margin:0;font-size:32px}main{max-width:1000px;margin:auto;padding:20px}section{background:white;border:1px solid #f1dce5;border-radius:18px;padding:20px;margin:14px 0}h2{font-size:19px;margin:0 0 14px}button,input,select,textarea{font:inherit;border:1px solid #e7cbd8;border-radius:9px;padding:10px}button{background:#f52b83;color:white;border:0;cursor:pointer}input,textarea,select{background:white;max-width:100%}textarea{width:100%;min-height:90px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.tile{background:#fff1f7;padding:16px;border-radius:12px}.task{display:flex;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid #eee}.task span{flex:1;overflow-wrap:anywhere}.done{text-decoration:line-through;color:#888}small{color:#806c76}form{display:flex;gap:8px;flex-wrap:wrap}form input{flex:1;min-width:130px}progress{width:100%;accent-color:#f52b83} .del{background:#eee;color:#444} .calnav{display:flex;align-items:center;gap:10px;margin-bottom:12px}.calnav strong{flex:1;text-align:center}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.weekday{text-align:center;color:#806c76;font-size:12px;padding:5px}.calday{background:#fff1f7;color:#302c32;min-height:48px;padding:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.calday.selected{background:#f52b83;color:white}.calday.today{outline:2px solid #f52b83;outline-offset:-2px}.calday small{font-size:10px;color:inherit}.eventrow{display:flex;align-items:center;gap:6px;padding:10px 0;border-bottom:1px solid #eee}.eventrow span{flex:1;overflow-wrap:anywhere}.eventrow button{padding:7px;font-size:12px}#eventForm{margin-bottom:12px}#eventForm input{min-width:110px} </style><header><small style="color:white">DESIGN MY LIFE · 2027</small><h1>LALA LIFE OS</h1><p>좋아하는 일을 하며 가족과 행복하게, 삶의 주도권을 갖기.</p></header><main><section id="schedule"><h2>나의 스케줄 · Calendar</h2><div class="calnav"><button id="prevMonth">‹</button><strong id="monthLabel"></strong><button id="nextMonth">›</button><button id="todayBtn" class="del">오늘</button></div><div id="calendar" class="calendar"></div><h3 id="dayLabel"></h3><form id="eventForm"><input id="eventTitle" required placeholder="일정 제목"><input id="eventDate" type="date" required aria-label="날짜"><input id="eventTime" type="time" aria-label="시작 시간"><input id="eventEnd" type="time" aria-label="종료 시간"><select id="eventArea" aria-label="분류"></select><input id="eventPlace" placeholder="장소 / 메모"><button id="eventSubmit">일정 추가</button><button type="button" id="cancelEdit" class="del" hidden>취소</button></form><div id="dayEvents"></div><h3>다가오는 일정</h3><div id="upcoming"></div></section><section><h2>나의 네 가지 프로젝트</h2><div class="grid" id="projects"></div></section><section><h2>오늘의 생각 정리</h2><textarea id="note" placeholder="머릿속에 떠오르는 생각을 자유롭게 기록하세요"></textarea><button id="save">기록 저장</button><div id="notes"></div></section><section><h2>실행 및 위임 보드</h2><form id="form"><input id="task" required placeholder="할 일 또는 아이디어"><select id="area"></select><select id="owner"><option>직접 실행</option><option>남편</option><option>ChatGPT</option><option>Claude</option><option>피클</option><option>운영 직원</option><option>전문가</option><option>나중에</option></select><button>추가</button></form><p id="summary"></p><div id="tasks"></div></section><section><h2>나의 성공 기준</h2><div id="metrics"></div><button id="export">데이터 백업 (JSON)</button><p><small>이 앱은 현재 브라우저에만 저장됩니다. 민감한 정보는 입력하지 마세요.</small></p></section></main><script>const areas=['가족과 건강','자산과 투자','공부와 연구','창작과 기록'];const desc=['부모님 · 남편 · 건강','혜도씨앤씨 · 혜도건설 · 투자','회계 · 세무 · 논문 · 아빠에게 배우는 경영학','그림 · 책 · 여행 · 영상'];const $=id=>document.getElementById(id);let s;try{s=JSON.parse(localStorage.getItem('lala-life-v1'))}catch{};s=s||{tasks:[['아빠와 경영 이야기 나누기',0,'직접 실행'],['임대관리 시스템 구축',1,'Claude'],['회계·세무 공부',2,'직접 실행'],['논문과 책 집필',2,'ChatGPT'],['그림과 전시 준비',3,'직접 실행'],['린스크 운영',1,'남편'],['마케팅 운영',3,'피클']].map((a,i)=>({id:i,text:a[0],area:a[1],owner:a[2],done:false})),notes:[],metrics:{}};function persist(){try{localStorage.setItem('lala-life-v1',JSON.stringify(s))}catch{alert('저장 실패: 백업을 이용하세요')}}function el(tag,text,cls){let e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e}areas.forEach((a,i)=>{$('area').add(new Option(a,i))});function render(){ $('projects').replaceChildren();areas.forEach((a,i)=>{let d=el('div','','tile'),t=s.tasks.filter(x=>x.area===i),n=t.filter(x=>x.done).length;d.append(el('h3',a),el('p',desc[i]));let p=document.createElement('progress');p.max=t.length||1;p.value=n;d.append(p,el('small',`${n}/${t.length} 완료`));$('projects').append(d)});$('tasks').replaceChildren();s.tasks.forEach(t=>{let d=el('div','','task'),c=document.createElement('input');c.type='checkbox';c.checked=t.done;c.onchange=()=>{t.done=c.checked;persist();render()};let b=el('button','삭제','del');b.onclick=()=>{s.tasks=s.tasks.filter(x=>x.id!==t.id);persist();render()};d.append(c,el('span',`${t.text} · ${areas[t.area]} · ${t.owner}`,t.done?'done':''),b);$('tasks').append(d)});$('summary').textContent=`완료 ${s.tasks.filter(t=>t.done).length} / ${s.tasks.length}건`;$('notes').replaceChildren();s.notes.forEach(n=>{let p=el('p',n.date+' · '+n.text);p.style.whiteSpace='pre-wrap';$('notes').append(p)})} $('form').onsubmit=e=>{e.preventDefault();s.tasks.push({id:Date.now(),text:$('task').value,area:+$('area').value,owner:$('owner').value,done:false});$('task').value='';persist();render()};$('save').onclick=()=>{if(!$('note').value.trim())return;s.notes.unshift({date:new Date().toLocaleString('ko-KR'),text:$('note').value});$('note').value='';persist();render()};['이번 주 중요한 일 완료 수','월 비노동 수익 (만원)','이번 주 자유시간 (시간)','좋아하는 일 선택 자유 (1~10)'].forEach((m,i)=>{let d=el('p',m+' '),v=document.createElement('input');v.type='number';v.min=0;if(i===3){v.min=1;v.max=10}v.value=s.metrics[i]??'';v.onchange=()=>{s.metrics[i]=v.value;persist()};d.append(v);$('metrics').append(d)});$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.download='lala-life-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render();
s.events=Array.isArray(s.events)?s.events:[];
const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
let selected=dateKey(new Date()),month=new Date(),editing=null;
areas.forEach((a,i)=>$('eventArea').add(new Option(a,i)));$('eventArea').add(new Option('기타',4));
function eventLine(ev,showDate){let row=el('div','','eventrow'),label=el('span',`${showDate?ev.date+' · ':''}${ev.time||'종일'}${ev.end?'–'+ev.end:''} · ${ev.title} · ${areas[ev.area]||'기타'}${ev.place?' · '+ev.place:''}`);let edit=el('button','수정','del'),del=el('button','삭제','del');edit.onclick=()=>{editing=ev.id;selected=ev.date;month=new Date(ev.date+'T12:00:00');renderCalendar();$('eventTitle').value=ev.title;$('eventDate').value=ev.date;$('eventTime').value=ev.time;$('eventEnd').value=ev.end||'';$('eventArea').value=ev.area;$('eventPlace').value=ev.place;$('eventSubmit').textContent='수정 저장';$('cancelEdit').hidden=false;$('eventTitle').focus()};del.onclick=()=>{if(!confirm('이 일정을 삭제할까요?'))return;s.events=s.events.filter(x=>x.id!==ev.id);if(editing===ev.id)resetEvent();persist();renderCalendar()};row.append(label,edit,del);return row}
function resetEvent(){editing=null;$('eventForm').reset();$('eventDate').value=selected;$('eventSubmit').textContent='일정 추가';$('cancelEdit').hidden=true}
function renderCalendar(){let y=month.getFullYear(),m=month.getMonth();$('monthLabel').textContent=`${y}년 ${m+1}월`;$('calendar').replaceChildren();['일','월','화','수','목','금','토'].forEach(d=>$('calendar').append(el('div',d,'weekday')));for(let i=0;i<new Date(y,m,1).getDay();i++)$('calendar').append(el('div',''));for(let d=1;d<=new Date(y,m+1,0).getDate();d++){let k=dateKey(new Date(y,m,d)),n=s.events.filter(e=>e.date===k).length,b=el('button',String(d),'calday'+(k===selected?' selected':'')+(k===dateKey(new Date())?' today':''));b.type='button';if(n)b.append(el('small',n+'건'));b.onclick=()=>{selected=k;resetEvent();renderCalendar()};$('calendar').append(b)}$('dayLabel').textContent=selected+' 일정';let sorted=[...s.events].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));let day=sorted.filter(e=>e.date===selected),up=sorted.filter(e=>e.date>=dateKey(new Date())).slice(0,15);$('dayEvents').replaceChildren(...(day.length?day.map(e=>eventLine(e,false)):[el('p','등록된 일정이 없어요.')]));$('upcoming').replaceChildren(...(up.length?up.map(e=>eventLine(e,true)):[el('p','다가오는 일정이 없어요.')]))}
$('eventForm').onsubmit=e=>{e.preventDefault();let title=$('eventTitle').value.trim(),date=$('eventDate').value,time=$('eventTime').value,end=$('eventEnd').value;if(!title||!date)return;if(end&&(!time||end<=time)){alert('종료 시간은 시작 시간 이후로 입력하세요.');return}let ev={id:editing??(Date.now()+'-'+Math.random()),title,date,time,end,area:+$('eventArea').value,place:$('eventPlace').value};s.events=s.events.filter(x=>x.id!==ev.id);s.events.push(ev);selected=date;month=new Date(date+'T12:00:00');persist();resetEvent();renderCalendar()};$('cancelEdit').onclick=resetEvent;$('prevMonth').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);renderCalendar()};$('nextMonth').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);renderCalendar()};$('todayBtn').onclick=()=>{month=new Date();selected=dateKey(month);resetEvent();renderCalendar()};resetEvent();renderCalendar();
</script></html>
